spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    # Sin usuario en memoria por defecto: evita "Using generated security password" en el log.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: America/Bogota

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /docs/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
